name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RubenchikMirror-installer
          path: release
      - name: Verify checksum
        run: cd release && sha256sum -c RubenchikMirror-Setup.exe.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="release/RubenchikMirror-Setup.exe release/RubenchikMirror-Setup.exe.sha256"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release was already created in the web UI: just attach the installer.
            gh release upload "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --repo "$GITHUB_REPOSITORY" --title "Rubenchik Mirror $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
