name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""

permissions:
  contents: read

env:
  UXPLAY_REPO: https://github.com/FDH2/UxPlay.git
  # Pinned UxPlay commit (master, v1.74 - includes the built-in mDNS responder, so no Bonjour is required).
  UXPLAY_REF: 05b0275cb1b726592700e47a6e0307544b3d3a52

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build UxPlay
        shell: msys2 {0}
        run: |
          git clone "$UXPLAY_REPO" uxplay-src
          git -C uxplay-src checkout "$UXPLAY_REF"
          # Make the binary portable to any x86-64 CPU (the runner's CPU is not the user's CPU).
          { grep -rl --include=CMakeLists.txt -e '-march=native' uxplay-src || true; } | xargs -r sed -i 's/-march=native//g'
          cmake -S uxplay-src -B uxplay-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNO_MARCH_NATIVE=ON
          cmake --build uxplay-build
          ls -la uxplay-build/uxplay.exe

      - name: Verify HLS (YouTube) support was compiled in
        shell: msys2 {0}
        run: |
          ntldd uxplay-build/uxplay.exe | grep -qi libcurl || { echo "::error::uxplay.exe is not linked against libcurl (no HLS)"; exit 1; }

      - name: Verify OpenSSL >= 3.0 (GPL-3.0 compliance)
        shell: msys2 {0}
        run: |
          pacman -Q mingw-w64-ucrt-x86_64-openssl
          openssl version
          openssl version | grep -E '^OpenSSL 3\.' || { echo "::error::OpenSSL 3.x required"; exit 1; }
          ntldd uxplay-build/uxplay.exe | grep -i libcrypto
          ntldd uxplay-build/uxplay.exe | grep -qi 'libcrypto-3' || { echo "::error::uxplay.exe is not linked against OpenSSL 3"; exit 1; }

      - name: Collect runtime bundle
        shell: msys2 {0}
        run: |
          bash scripts/collect-bundle.sh dist/app uxplay-build/uxplay.exe
          cp packaging/uxplayrc.pin dist/app/uxplayrc   # smoke-test the PIN-enabled config
          cp uxplay-src/LICENSE dist/app/UxPlay-LICENSE.txt

      - name: Smoke test (clean PATH, no MSYS2)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -App "$PWD/dist/app"

      - name: Remove CI-only tools from bundle
        shell: pwsh
        run: Remove-Item dist/app/bin/gst-inspect-1.0.exe

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v -and $env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          if (-not $v) { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $h = (Get-FileHash dist/RubenchikMirror-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  RubenchikMirror-Setup.exe" | Out-File -Encoding ascii dist/RubenchikMirror-Setup.exe.sha256
          Get-Item dist/RubenchikMirror-Setup.exe | Format-List Name, Length
          Get-Content dist/RubenchikMirror-Setup.exe.sha256

      - name: Silent install / uninstall test
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\rm-install"
          Start-Process dist/RubenchikMirror-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=desktopicon,autostart,pin /DIR=`"$dir`" /LOG=`"$env:RUNNER_TEMP\inst.log`"" -Wait
          if (-not (Test-Path "$dir\bin\uxplay.exe")) { Get-Content "$env:RUNNER_TEMP\inst.log"; throw "uxplay.exe not installed" }
          netsh advfirewall firewall show rule name="Rubenchik Mirror" | Out-String | Write-Host
          if ((netsh advfirewall firewall show rule name="Rubenchik Mirror" | Out-String) -match 'No rules match') { throw "firewall rule missing" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $startup = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\Rubenchik Mirror.lnk"
          if (-not (Test-Path $startup)) { throw "autostart shortcut missing although the task was selected" }
          if ((Get-Content "$dir\uxplayrc") -notcontains 'pin') { throw "PIN task selected but 'pin' missing from installed uxplayrc" }
          foreach ($f in 'LICENSE','THIRD_PARTY_NOTICES.md','UxPlay-LICENSE.txt','README.md') { if (-not (Test-Path "$dir\$f")) { throw "$f not installed" } }
          & "$dir\bin\uxplay.exe" -h *> $null
          if ($LASTEXITCODE -gt 1) { throw "installed uxplay.exe failed to start" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\bin\uxplay.exe") { throw "uninstall left files behind" }
          if (Test-Path $startup) { throw "uninstall left the autostart shortcut" }
          if ((netsh advfirewall firewall show rule name="Rubenchik Mirror" | Out-String) -notmatch 'No rules match') { throw "uninstall left firewall rule" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: RubenchikMirror-installer
          path: |
            dist/RubenchikMirror-Setup.exe
            dist/RubenchikMirror-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
